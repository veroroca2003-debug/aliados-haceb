<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliados Haceb · Panel interno (piloto)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Colores tomados de las imágenes de marca compartidas (verde lima aproximado, negro y blanco). Confirmar con el manual de marca de Haceb.
   Layout: columna única de 480 px para el registro; las vistas del equipo y de contenido usan 980 px. */
:root {
  --ink: #111111;
  --muted: #5b6470;
  --line: #dfe2e6;
  --bg: #f3f3f1;
  --card: #ffffff;
  --brand: #b6cc22;
  --brand-dark: #56630a;
  --brand-soft: #f1f6cc;
  --danger: #b3261e;
  --good: #1f7a4d;
  --good-soft: #e6f4ec;
  --warn: #8a5a00;
  --warn-soft: #fff3da;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { background: #000; border-bottom: 4px solid var(--brand); }
.top-in { max-width: 980px; margin: 0 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-style: italic; font-size: 28px; letter-spacing: 0.01em; color: #fff; line-height: 1; }
.wordmark span { color: var(--brand); }
.demo-note { font-size: 13px; color: #cfd3d6; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font-weight: 700; color: #cfd3d6; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--brand); }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.app { max-width: 480px; margin: 0 auto; }
.progress { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; }
h2 { font-size: 26px; margin-bottom: 6px; }
h3 { font-size: 20px; margin-bottom: 8px; }
p { margin: 0 0 12px; }
.sub { color: var(--muted); margin-bottom: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
label, .lab { font-weight: 700; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); font-weight: 400; }
input[type=text], input[type=tel], select { width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; min-height: 48px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
nav.tabs button:focus-visible { outline-color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 14px; min-height: 44px; cursor: pointer; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--brand); color: #000; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--brand-soft); box-shadow: inset 4px 0 0 var(--brand); }
.opt b { display: block; }
.opt small { color: var(--muted); }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }
.row-btn { display: flex; gap: 10px; margin-top: 8px; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 8px; border: 1.5px solid var(--ink); background: #fff; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--brand); border-color: #000; color: #000; flex: 1; }
.btn.primary:hover { background: #a3b81c; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.consent { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
.consent input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--brand); }
.consent .t { font-size: 14px; font-weight: 400; }
.consent .t b { display: block; font-size: 15px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.tag.req { background: var(--brand-soft); color: var(--brand-dark); }
.tag.nop { background: #eceef0; color: var(--muted); }
.legal { font-size: 13px; color: var(--muted); background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
.level { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--brand-soft); border-radius: 10px; margin: 14px 0; }
.level .n { font-family: var(--font-display); font-weight: 700; font-size: 34px; color: var(--brand-dark); line-height: 1; }
.week { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
.week li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.week .d { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.week .s { font-size: 13px; color: var(--muted); }
.chat { background: #e9efe9; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
.bubble { background: #fff; border-radius: 12px 12px 12px 2px; padding: 10px 12px; font-size: 15px; max-width: 92%; box-shadow: 0 1px 1px rgba(0,0,0,.08); white-space: pre-line; }
.chat .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.notice { font-size: 14px; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.good { background: var(--good-soft); color: var(--good); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tile b { font-family: var(--font-display); font-size: 32px; display: block; line-height: 1; }
.tile span { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f7f7f6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.yes { background: var(--good-soft); color: var(--good); }
.pill.no { background: var(--warn-soft); color: var(--warn); }
.pill.demo { background: #eceef0; color: var(--muted); }
.section { margin-bottom: 28px; }
.section > p { color: var(--muted); max-width: 70ch; }
textarea.csv { width: 100%; height: 120px; font-family: monospace; font-size: 12px; margin-top: 10px; border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; }

.ladder { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 12px; }
.ladder li { display: grid; grid-template-columns: 56px 1fr; gap: 14px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; padding: 14px; }
.ladder .num { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #000; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 30px; display: flex; align-items: center; justify-content: center; }
.ladder li.top .num { background: #000; color: var(--brand); }
.ladder b { font-family: var(--font-display); font-size: 21px; display: block; }
.ladder .k { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 8px; }
.ladder p { margin: 2px 0 0; font-size: 14px; }
.qrgrid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(260px, 340px) 1fr; gap: 20px; align-items: start; margin-bottom: 24px; }
@media (max-width: 1000px) { .qrgrid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 720px) { .qrgrid { grid-template-columns: 1fr; } }
.qrcard { background: #000; color: #fff; border-radius: 14px; padding: 22px; text-align: center; border-bottom: 8px solid var(--brand); }
.qrcard .wm { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 26px; }
.qrcard .wm span { color: var(--brand); }
.qrcard .q { background: #fff; border-radius: 10px; padding: 6px; margin: 14px auto; width: 220px; max-width: 100%; }
.qrcard .q svg { display: block; width: 100%; height: auto; }
.qrcard .go { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 22px; color: var(--brand); line-height: 1.1; }
.qrcard .url { font-size: 11px; color: #cfd3d6; word-break: break-all; margin-top: 10px; }

.perfil { margin: 6px 0 14px; }
.who b { font-family: var(--font-display); font-size: 22px; display: block; }
.who span { color: var(--muted); font-size: 14px; }
.levelbig { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--brand-soft); border-radius: 10px; margin: 12px 0; }
.levelbig .n { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 42px; line-height: 1; background: var(--brand); color: #000; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.stepper { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0; margin: 0 0 14px; }
.stepper .st { text-align: center; }
.stepper .st span { display: flex; width: 32px; height: 32px; margin: 0 auto 4px; border-radius: 50%; border: 2px solid var(--line); align-items: center; justify-content: center; font-weight: 700; background: #fff; }
.stepper .st.on span { background: var(--brand); border-color: #000; color: #000; }
.stepper .st.cur span { background: #000; color: var(--brand); border-color: #000; }
.stepper small { font-size: 12px; color: var(--muted); }
.stepper .st.cur small { color: var(--ink); font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.kv div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.kv small { display: block; font-size: 11px; color: var(--muted); }
.kv b { font-size: 15px; }
.checks { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
.checks li { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.checks li.ok { background: var(--good-soft); }
.checks em { color: var(--muted); font-style: normal; font-size: 13px; }
.bono { border: 2px solid #000; border-radius: 10px; padding: 12px; margin-bottom: 14px; background: var(--brand-soft); }
.bono small { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.bono b { font-family: var(--font-display); font-size: 30px; display: block; line-height: 1.1; }
.prueba { margin: 6px 0 16px; border: 1px dashed var(--muted); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.prueba summary { cursor: pointer; font-weight: 700; }
.prueba table { width: 100%; font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 4px 0; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 10px 0; }
.calc label { display: flex; flex-direction: column; gap: 4px; }
.calc input { width: 100%; padding: 10px; border: 1.5px solid var(--line); border-radius: 8px; min-height: 44px; }
.out { border: 2px solid #000; border-radius: 10px; padding: 12px; background: var(--brand-soft); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
@media (max-width: 420px) { h1 { font-size: 28px; } .card { padding: 16px; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="wordmark">Aliados <span>Haceb</span> <small style="font-size:14px;font-style:normal;color:#cfd3d6;font-family:var(--font-body)">· Panel interno</small></div>
    <div class="demo-note">Panel interno del piloto, solo para el equipo. Todos los datos de esta pantalla son ficticios. No muestra información real de ningún técnico.</div>
    <nav class="tabs" role="tablist" aria-label="Vistas del panel interno">
      <button role="tab" id="tab-panel" aria-selected="true" aria-controls="panel" data-tab="panel">Clientes y niveles</button>
      <button role="tab" id="tab-benef" aria-selected="false" aria-controls="panel" data-tab="benef">Beneficios y presupuesto</button>
      <button role="tab" id="tab-contenido" aria-selected="false" aria-controls="panel" data-tab="contenido">Contenido que se activa</button>
      <button role="tab" id="tab-qr" aria-selected="false" aria-controls="panel" data-tab="qr">Código QR</button>
      <button role="tab" id="tab-base" aria-selected="false" aria-controls="panel" data-tab="base">Base de facturación (ficticia)</button>
    </nav>
  </div>
</header>
<main id="panel" role="tabpanel"></main>

<script>
(function () {
  "use strict";

  /* ---------- Datos del flujo ---------- */
  var ORIGENES = ["Distribuidor", "Capacitación", "Evento de la marca", "Mi cadena me inscribió"];
  var TIPOS = [
    { id: "independiente", t: "Independiente", s: "Trabajo solo y compro por necesidad" },
    { id: "taller", t: "Taller con ayudantes", s: "Atiendo varios locales con mi equipo" },
    { id: "cadena", t: "Técnico de cadena", s: "Atiendo las tiendas de una cadena" }
  ];
  var EQUIPOS = ["Cavas", "Vitrinas", "Neveras"];
  var CLIENTES = ["Tiendas", "Panaderías", "Restaurantes", "Otros"];
  var EXPERIENCIA = ["Menos de 5 años", "5 a 10 años", "10 a 20 años", "Más de 20 años"];
  var FRECUENCIA = [
    { id: "semana", t: "Cada semana" },
    { id: "quincena", t: "Cada 2 a 3 semanas" },
    { id: "mes", t: "Cada mes" },
    { id: "ocasional", t: "Solo cuando lo necesito" }
  ];
  var AYUDANTES = ["1", "2", "3", "4 o más"];
  var DOLORES = [
    { id: "agotado", t: "El repuesto está agotado" },
    { id: "referencia", t: "No sé qué referencia pedir" },
    { id: "garantias", t: "Me discuten la garantía" },
    { id: "info", t: "No tengo información técnica del equipo" },
    { id: "cobro", t: "Cobrar a mis clientes a 30 o 60 días" }
  ];
  var TEMAS = [
    { id: "fallas", t: "Fallas frecuentes y diagnóstico" },
    { id: "compresores", t: "Compresores y motores" },
    { id: "garantias", t: "Garantías" },
    { id: "nuevos", t: "Productos nuevos" },
    { id: "taller", t: "Organizar mi taller" }
  ];
  var FORMATOS = ["Videos cortos", "Infografías", "Presencial en el distribuidor"];
  var HORARIOS = ["7:00 a 9:00 a. m.", "12:00 a 2:00 p. m.", "5:00 a 7:00 p. m."];
  var VERSION_TEXTO = "v0-demo (pendiente de validación por Legal)";

  /* Contenido por respuesta: es la fuente única de la vista "Contenido que se activa" y del plan del técnico. */
  var CONTENIDO_DOLOR = {
    agotado: { titulo: "Cómo pedir un repuesto crítico sin perder tiempo", formato: "Microvideo de 60 s", nota: "Tema: la placa del equipo y los datos que aceleran la respuesta" },
    referencia: { titulo: "Cómo buscar un repuesto por referencia, familia o equipo", formato: "Tutorial del catálogo", nota: "Depende de que el catálogo MVP esté listo" },
    garantias: { titulo: "Qué reunir antes de pedir una garantía", formato: "Infografía", nota: "Las reglas las confirma el área de garantías antes de publicar" },
    info: { titulo: "Fichas técnicas y despieces a la mano", formato: "Biblioteca técnica", nota: "Solo material validado por el área técnica" },
    cobro: { titulo: "Calculadora de presupuesto de servicio", formato: "Herramienta", nota: "Idea por validar; no resuelve el plazo de pago de sus clientes" }
  };
  var CONTENIDO_TEMA = {
    fallas: { titulo: "Serie: fallas frecuentes y cómo diagnosticarlas", formato: "Microcápsula semanal" },
    compresores: { titulo: "Módulo 1 de la ruta Especialista: compresores y motores", formato: "Presencial en el distribuidor" },
    garantias: { titulo: "Guía de garantías para el técnico", formato: "Infografía y consulta" },
    nuevos: { titulo: "Novedades de producto", formato: "Boletín quincenal" },
    taller: { titulo: "Organizar pedidos y tiempos del taller", formato: "Video corto y plantilla" }
  };
  var SERIES = {
    taller: { nombre: "Operación del taller", foco: "Pedidos críticos, seguimiento y certificación avanzada" },
    independiente: { nombre: "Crece con tu oficio", foco: "Ruta Especialista, sello y referidos" },
    cadena: { nombre: "Soporte técnico directo", foco: "Fichas, despieces y garantías, sin incentivos de compra" }
  };

  /* ---------- Estado ---------- */
  var seed = [
    mk("Técnico ejemplo A", "Medellín", "taller", "Distribuidor", true, true, false, "Cada semana"),
    mk("Técnico ejemplo B", "Bogotá", "independiente", "Capacitación", true, false, false, "Cada mes"),
    mk("Técnico ejemplo C", "Cali", "cadena", "Mi cadena me inscribió", true, true, false, "Solo cuando lo necesito"),
    mk("Técnico ejemplo D", "Medellín", "independiente", "Evento de la marca", true, true, true, "Cada 2 a 3 semanas")
  ];
  function mk(nombre, ciudad, tipo, origen, datos, wa, dir, frec) {
    return { demo: true, ts: "Ejemplo", nombre: nombre, celular: "—", ciudad: ciudad, tipo: tipo, origen: origen,
      consentDatos: datos, consentWhatsapp: wa, consentDirectorio: dir, frecuencia: frec, nivel: "1 · Registrado" };
  }
  function blank() {
    return { origen: "", nombre: "", celular: "", ciudad: "", tipo: "", cadena: "", ayudantes: "", equipos: [], clientes: [],
      experiencia: "", frecuencia: "", distribuidor: "", dolores: [], temas: [], formato: "", horario: "",
      consentDatos: false, consentWhatsapp: false, consentDirectorio: false };
  }
  var S = { tab: "panel", seg: "todos", step: 0, d: blank(), errors: {}, records: seed.slice(), last: null, csv: false };
  var TOTAL = 5;

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tipoNombre(id) { var t = TIPOS.filter(function (x) { return x.id === id; })[0]; return t ? t.t : ""; }
  function frecNombre(id) { var f = FRECUENCIA.filter(function (x) { return x.id === id; })[0]; return f ? f.t : id || ""; }
  function validCel(v) { return /^3\d{9}$/.test(v.replace(/\D/g, "")); }
  function now() { var d = new Date(); return d.toLocaleDateString("es-CO") + " " + d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }); }
  function toggle(arr, v) { var i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); }
  function chips(field, items, multi, getId, getT) {
    return '<div class="chips" role="group">' + items.map(function (it) {
      var id = getId ? getId(it) : it, t = getT ? getT(it) : it;
      var on = multi ? S.d[field].indexOf(id) > -1 : S.d[field] === id;
      return '<button type="button" class="chip" data-chip="' + field + '" data-multi="' + (multi ? 1 : 0) + '" data-val="' + esc(id) + '" aria-pressed="' + on + '">' + esc(t) + '</button>';
    }).join("") + '</div>';
  }

  /* ---------- Motor de contenido ---------- */
  function plan(r) {
    var serie = SERIES[r.tipo] || SERIES.independiente;
    var wa = !!r.consentWhatsapp;
    var canal = wa ? "WhatsApp, " + (r.horario || "en el horario que elegiste") : "Catálogo web y entrega presencial (sin mensajes comerciales)";
    var piezas = [];
    piezas.push({ dia: "Día 0", titulo: wa ? "Mensaje de bienvenida y confirmación de tus autorizaciones" : "Pantalla de confirmación con el enlace al catálogo", canal: wa ? "WhatsApp" : "En pantalla" });
    var dolores = (r.dolores || []).slice(0, 2);
    dolores.forEach(function (d, i) {
      var c = CONTENIDO_DOLOR[d];
      piezas.push({ dia: i === 0 ? "Día 2" : "Día 7", titulo: c.titulo, canal: wa ? c.formato + " por WhatsApp" : c.formato + " en el catálogo web", nota: c.nota });
    });
    if (!dolores.length) {
      piezas.push({ dia: "Día 2", titulo: CONTENIDO_DOLOR.referencia.titulo, canal: wa ? "Tutorial por WhatsApp" : "Tutorial en el catálogo web", nota: CONTENIDO_DOLOR.referencia.nota });
    }
    var tema = (r.temas || [])[0];

      '<tr><td>Técnico de cadena</td><td>Sin bonos ni puntos; recibe soporte técnico, fichas y garantías.</td></tr>' +
      '<tr><td>Directorio y casos reales</td><td>Solo con autorización aparte y, para casos reales, por escrito.</td></tr>' +
      '</tbody></table></div></div>';
  }


  function fin(c) { return evalCli(c); }
  function viewPanel() {
    var rs = DATA.map(function (c) { return { c: c, e: evalCli(c) }; });
    var por = [0, 0, 0, 0, 0]; rs.forEach(function (x) { por[x.e.nivel]++; });
    var bloqueados = rs.filter(function (x) { var c = x.c; return c.seg !== "S6" && c.compras > 0 && c.pedidos >= 2 && c.trim >= 2 && c.seg60 && !c.aut; }).length;
    var bonoTotal = rs.reduce(function (a, x) { return a + x.e.bono; }, 0);
    var segs = ["S1", "S2", "S3", "S4", "S5", "S6"];
    var matriz = segs.map(function (s) {
      var f = rs.filter(function (x) { return x.c.seg === s; }), n = [0, 0, 0, 0, 0];
      f.forEach(function (x) { n[x.e.nivel]++; });
      return '<tr><td>' + s + ' · ' + esc(SEG_N[s]) + '</td><td>' + f.length + '</td><td>' + n[1] + '</td><td>' + n[2] + '</td><td>' + n[3] + '</td><td>' + n[4] + '</td></tr>';
    }).join("");
    var lista = rs.filter(function (x) { return S.seg === "todos" || x.c.seg === S.seg; }).map(function (x) {
      var c = x.c;
      return '<tr><td>' + c.ced + '</td><td>' + esc(c.nombre) + '</td><td>' + esc(c.ciudad) + '</td><td>' + esc(TIPO_N[c.tipo]) + '</td><td>' + c.seg + '</td><td>' + (c.compras ? cop(c.compras) : "$0") + '</td><td>' + x.e.nivel + ' · ' + esc(NIV_N[x.e.nivel]) + '</td><td>' + pill(c.aut) + '</td><td>' + (x.e.bono ? cop(x.e.bono) : "—") + '</td></tr>';
    }).join("");
    var opts = ['<option value="todos">Todos los segmentos</option>'].concat(segs.map(function (s) { return '<option value="' + s + '"' + (S.seg === s ? " selected" : "") + '>' + s + ' · ' + esc(SEG_N[s]) + '</option>'; })).join("");
    return '<div class="section"><h2>Clientes y niveles</h2><p>Cruce entre la cédula y la facturación (base ficticia de 60 clientes). El nivel lo calcula el sistema con reglas fijas; el técnico solo ve su propia pantalla en el piloto de clientes.</p></div>' +
      '<div class="tiles"><div class="tile"><b>' + DATA.length + '</b><span>Clientes en la base de prueba</span></div><div class="tile"><b>' + por[1] + '</b><span>Registrado</span></div><div class="tile"><b>' + por[2] + '</b><span>Aliado</span></div><div class="tile"><b>' + por[3] + '</b><span>Certificado</span></div><div class="tile"><b>' + por[4] + '</b><span>Aliado VIP</span></div></div>' +
      '<div class="notice warn"><b>' + bloqueados + ' clientes</b> cumplen las condiciones de compra para ser Aliado, pero no suben porque no tienen autorización vigente. Es el primer frente de trabajo: regularizar el consentimiento.</div>' +
      '<div class="section"><h3>Nivel por segmento</h3><div class="table-wrap"><table><thead><tr><th>Segmento</th><th>Clientes</th><th>Registrado</th><th>Aliado</th><th>Certificado</th><th>VIP</th></tr></thead><tbody>' + matriz + '</tbody></table></div></div>' +
      '<div class="section"><h3>Clientes</h3><div class="toolbar"><label for="f-seg" class="hint">Filtrar por segmento</label><select id="f-seg" data-seg="1" style="max-width:320px">' + opts + '</select></div><div class="table-wrap"><table><thead><tr><th>Cédula</th><th>Nombre</th><th>Ciudad</th><th>Tipo</th><th>Seg.</th><th>Compras 12 m</th><th>Nivel</th><th>Autoriz.</th><th>Bono estimado</th></tr></thead><tbody>' + lista + '</tbody></table></div><p class="hint" style="margin-top:8px">Bono estimado total de esta muestra: ' + cop(bonoTotal) + ' (si todos redimen).</p></div>';
  }
  var COSTO = { s3: 475 * 0.10 * 0.10, s2: 859 * 0.15 * 0.15, s1: 3763 * 0.12 * 0.20, reg: 1303 * 0.1936 * 0.05 };
  function costo(cre, red) {
    var cc = (COSTO.s3 + COSTO.s2 + COSTO.s1) * cre / 100 * red / 100, rg = COSTO.reg * red / 100;
    var inc = (475 * 0.10 + 859 * 0.15 + 3763 * 0.12) * cre / 100;
    return { crec: cc, reg: rg, tot: cc + rg, inc: inc, margen: inc * 0.35 };
  }
  function fm(x) { return x.toFixed(1).replace(".", ","); }
  function viewBenef() {
    var b = costo(100, 100), tope = Math.round((145 - b.reg) / (b.crec) * 100);
    return '<div class="section"><h2>Beneficios por nivel y presupuesto</h2><p>El beneficio es un bono que se entrega en repuesto o herramienta después de comprar. No baja el precio en el mostrador. El porcentaje alto se aplica solo al crecimiento, es decir, a lo que el técnico compra de más frente a sus 12 meses anteriores. Así Haceb paga únicamente cuando vende más, y el bono nunca supera el margen de esa venta adicional.</p></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Nivel</th><th>Bono</th><th>Se calcula sobre</th><th>Otros beneficios</th><th>Condición</th></tr></thead><tbody>' +
      '<tr><td>1 · Registrado</td><td>5%</td><td>Su primera compra después de registrarse (tope por definir)</td><td>Contenido de inicio y biblioteca</td><td>Registro con autorización de datos vigente</td></tr>' +
      '<tr><td>2 · Aliado</td><td>10%</td><td>Crecimiento frente a sus 12 meses anteriores</td><td>Boletín y contenido de su serie</td><td>2.ª compra en 60 días, dos trimestres seguidos, autorización vigente</td></tr>' +
      '<tr><td>3 · Certificado</td><td>15%</td><td>Crecimiento frente a sus 12 meses anteriores</td><td>Sello, directorio (si autoriza), contenido avanzado</td><td>Aliado, Ruta Especialista aprobada, menos de 25% de pedidos con descuento</td></tr>' +
      '<tr><td>4 · Aliado VIP</td><td>20%</td><td>Crecimiento frente a sus 12 meses anteriores</td><td>Atención prioritaria, si la operación puede cumplirla</td><td>Certificado y cuatro trimestres seguidos</td></tr>' +
      '<tr><td>Técnico de cadena</td><td>0%</td><td>No aplica</td><td>Soporte técnico directo y certificación</td><td>No hay bonos: compra la cadena</td></tr></tbody></table></div>' +
      '<div class="section" style="margin-top:20px"><h3>Cuánto cuesta frente al presupuesto</h3>' +
      '<p>El caso asigna $145 M al pilar de beneficios y recompra. Con el crecimiento que supone el caso (S1 +12%, S2 +15%, S3 +10%), con S1 en VIP, S2 en Certificado y S3 en Aliado, el bono por crecimiento cuesta <b>$' + fm(b.crec) + ' M</b> y el bono de bienvenida hasta <b>$' + fm(b.reg) + ' M</b>. Total: <b>$' + fm(b.tot) + ' M</b> de $145 M. El pilar aguanta hasta cerca de ' + tope + '% del crecimiento supuesto antes de rebasarse.</p>' +
      '<div class="calc"><label>% del crecimiento supuesto que se logra<input type="number" min="0" max="300" value="100" data-calc="cre"></label><label>% de bonos que se redimen<input type="number" min="0" max="100" value="100" data-calc="red"></label></div>' +
      '<div class="out" id="calc-out" aria-live="polite"></div>' +
      '<p class="hint" style="margin-top:10px">Supuestos: el crecimiento por segmento viene del modelo financiero del caso. El margen bruto del caso no existe; se usa el 35% supuesto. En la hoja de segmentación del caso, S3 aparece en cero; aquí se usa G4 + G9 = $475 M. El bono de bienvenida se calcula con 1.303 compradores sin cadena, el ticket promedio de $194 mil y 5%, como techo. Con el descuento plano de 20% de junio no se puede comparar en pesos porque su costo real no está en el caso.</p></div>' +
      '<div class="notice warn">Riesgo a vigilar: G4 compra el 86% de sus pedidos con descuento. Al cambiar el descuento plano por un bono, parte de ese grupo puede comprar menos. Por eso el bono se activa en la segunda compra dentro de 60 días y se mide la recompra a 90 días contra el 27% de junio.</div>';
  }
  function updCalc() {
    var g = function (k, mx) { var el = document.querySelector('[data-calc="' + k + '"]'); return Math.max(0, Math.min(mx, parseFloat(el && el.value) || 0)); };
    var cre = g("cre", 300), red = g("red", 100), out = document.getElementById("calc-out");
    if (!out) return;
    var r = costo(cre, red);
    out.innerHTML = 'Costo estimado: <b>$' + fm(r.tot) + ' M</b> de $145 M (' + Math.round(r.tot / 145 * 100) + '%). Margen bruto de la venta adicional (35% supuesto): <b>$' + fm(r.margen) + ' M</b>.' +
      (r.tot > 145 ? ' <b>Supera el pilar:</b> se necesitaría un tope por técnico o usar la reserva de $20 M.' : '');
  }
  function viewBase() {
    var rows = DATA.map(function (c) { return '<tr><td>' + c.ced + '</td><td>' + esc(c.nombre) + '</td><td>' + esc(c.ciudad) + '</td><td>' + c.grupo + '</td><td>' + c.seg + '</td><td>' + esc(c.tipo) + '</td><td>' + c.compras + '</td><td>' + c.base + '</td><td>' + c.pedidos + '</td><td>' + Math.round(c.pctDesc * 100) + '%</td><td>' + c.trim + '</td><td>' + (c.seg60 ? "Sí" : "No") + '</td><td>' + (c.ruta ? "Sí" : "No") + '</td><td>' + (c.aut ? "Sí" : "No") + '</td></tr>'; }).join("");
    return '<div class="section"><h2>Base de facturación (ficticia)</h2><p>Sirve para probar el cruce por cédula. Los nombres y las cédulas (que empiezan por 9) no corresponden a personas reales; las cifras siguen el orden de magnitud de cada grupo del caso. En producción esta base sale del sistema de facturación y el cruce lo hace un servidor, no el navegador.</p></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Cédula</th><th>Nombre</th><th>Ciudad</th><th>Grupo</th><th>Seg.</th><th>Tipo</th><th>Compras 12 m ($M)</th><th>12 meses anteriores ($M)</th><th>Pedidos</th><th>% con desc.</th><th>Trim. seguidos</th><th>2.ª compra &lt;60 d</th><th>Ruta Especialista</th><th>Autoriz.</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ---------- Render y eventos ---------- */
  var root = document.getElementById("panel");
  function render() {
    var h = S.tab === "panel" ? viewPanel() : S.tab === "benef" ? viewBenef() : S.tab === "base" ? viewBase() : S.tab === "qr" ? viewQr() : viewContenido();
    root.innerHTML = h;
    if (S.tab === "benef") updCalc();
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === S.tab ? "true" : "false"); });
  }
  function validate() {
    var d = S.d, e = {};
    if (S.step === 1) {
      if (d.nombre.trim().length < 3) e.nombre = "Escribe tu nombre completo.";
      if (!validCel(d.celular)) e.celular = "Escribe un celular de 10 dígitos que empiece por 3.";
      if (d.ciudad.trim().length < 2) e.ciudad = "Escribe tu ciudad.";
      if (!d.tipo) e.tipo = "Elige cómo trabajas.";
    }
    if (S.step === 4 && !d.consentDatos) e.consent = "Sin esta autorización no podemos completar el registro.";
    S.errors = e;
    return Object.keys(e).length === 0;
  }
  function finish() {
    var d = S.d;
    var rec = {
      demo: false, ts: now(), nombre: d.nombre.trim(), celular: d.celular.replace(/\D/g, ""), ciudad: d.ciudad.trim(), tipo: d.tipo,
      origen: d.origen || "Sin dato", consentDatos: d.consentDatos, consentWhatsapp: d.consentWhatsapp, consentDirectorio: d.consentDirectorio,
      frecuencia: frecNombre(d.frecuencia), nivel: "1 · Registrado", dolores: d.dolores.slice(), temas: d.temas.slice(), experiencia: d.experiencia,
      horario: d.horario
    };
    rec.frecuenciaId = d.frecuencia;
    S.records.push({ demo: false, ts: rec.ts, nombre: rec.nombre, celular: rec.celular, ciudad: rec.ciudad, tipo: rec.tipo, origen: rec.origen,
      consentDatos: rec.consentDatos, consentWhatsapp: rec.consentWhatsapp, consentDirectorio: rec.consentDirectorio, frecuencia: d.frecuencia,
      nivel: rec.nivel, dolores: rec.dolores, temas: rec.temas, experiencia: rec.experiencia });
    S.last = { tipo: d.tipo, nombre: d.nombre.trim(), consentWhatsapp: d.consentWhatsapp, dolores: d.dolores.slice(), temas: d.temas.slice(), frecuencia: d.frecuencia, experiencia: d.experiencia, horario: d.horario };
    S.step = 5;
  }
  root.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-chip],[data-go]");
    if (!t) return;
    var chip = t.getAttribute("data-chip");
    if (chip) {
      var val = t.getAttribute("data-val"), multi = t.getAttribute("data-multi") === "1";
      if (multi) {
        if (chip === "dolores" && S.d.dolores.indexOf(val) < 0 && S.d.dolores.length >= 2) return;
        toggle(S.d[chip], val);
      } else { S.d[chip] = S.d[chip] === val ? "" : val; }
      S.errors = {}; render(); return;
    }
    var go = t.getAttribute("data-go");
    if (go === "next") {
      if (!validate()) { render(); return; }
      if (S.step === 4) finish(); else S.step++;
      render(); window.scrollTo(0, 0);
    } else if (go === "back") { S.errors = {}; S.step = Math.max(0, S.step - 1); render(); window.scrollTo(0, 0); }
    else if (go === "again") { S.d = blank(); S.step = 0; S.errors = {}; render(); window.scrollTo(0, 0); }
    else if (go === "escalera") { S.tab = "escalera"; render(); window.scrollTo(0, 0); }
    else if (go === "csv") {
      var text = toCsv();
      try { navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {}
      S.csv = true; render();
    }
  });
  root.addEventListener("input", function (ev) {
    if (ev.target.getAttribute("data-calc")) { updCalc(); return; }
    var f = ev.target.getAttribute("data-in");
    if (f) S.d[f] = ev.target.value;
  });
  root.addEventListener("change", function (ev) {
    if (ev.target.getAttribute("data-seg")) { S.seg = ev.target.value; render(); return; }
    var c = ev.target.getAttribute("data-chk");
    if (c) { S.d[c] = ev.target.checked; S.errors = {}; render(); }
  });
  document.querySelector("nav.tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-tab]");
    if (!b) return;
    S.tab = b.getAttribute("data-tab"); render(); window.scrollTo(0, 0);
  });
  render();
})();
</script>
</body>
</html>
